name: dazi_app
description: 成分雷达 App —— 拍一下配料表，看懂你吃的东西
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # 状态管理
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # 路由
  go_router: ^14.2.0

  # 网络图片缓存
  cached_network_image: ^3.3.1

  # 响应式布局
  flutter_screenutil: ^5.9.3

  # 图标
  cupertino_icons: ^1.0.8

  # 时间格式化
  timeago: ^3.7.0

  # 本地存储
  shared_preferences: ^2.3.1

  # 网络请求
  dio: ^5.7.0

  # 安全存储（Token）
  flutter_secure_storage: ^9.2.2

  # 图片选取（相册/拍照）
  image_picker: ^1.1.2
  camera: ^0.11.0

  # 图表（记录页周统计）
  fl_chart: ^0.69.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  riverpod_generator: ^2.4.3
  build_runner: ^2.4.13
  custom_lint: ^0.7.6
  riverpod_lint: ^2.6.5

flutter:
  uses-material-design: true
  assets:
    - assets/images/
